$kind: http-request
method: GET
url: '{{baseUrl}}/api/auth/me'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Authenticated profile returned', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().id).to.equal(pm.variables.get('userId'));
        pm.expect(pm.response.json().fullName).to.equal('Registration Smoke Test');
      });
