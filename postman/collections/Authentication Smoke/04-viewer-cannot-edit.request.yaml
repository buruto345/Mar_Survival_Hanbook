$kind: http-request
method: POST
url: '{{baseUrl}}/api/admin/discover-mars/articles'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Viewer cannot create content', () => pm.response.to.have.status(403));
