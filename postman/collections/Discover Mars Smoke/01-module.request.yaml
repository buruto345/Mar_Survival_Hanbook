$kind: http-request
method: GET
url: '{{baseUrl}}/api/discover-mars'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Discover Mars module', () => pm.expect(pm.response.json().slug).to.eql('discover-mars'));
      pm.test('Public response cannot be cached across revocation', () => pm.expect(pm.response.headers.get('Cache-Control')).to.include('no-store'));
examples: './.resources/01-module.resources/examples'
