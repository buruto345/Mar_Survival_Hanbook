headers:
  - key: If-Match
    value: string
    disabled: false
    description: (Required) Quoted ETag from GET of the source revision, task, job, connector or working resource being changed.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 782db424-aac5-8763-3211-065257b84b58
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "decision": "<string>",
      "notes": "string",
      "checklist": {
        "sourcesChecked": false,
        "claimsChecked": false,
        "unitsChecked": false,
        "evidenceChecked": false,
        "mediaRightsChecked": true
      }
    }
auth:
