url: "{{baseUrl}}/api/admin/discover-mars/reviews/:id/decision"
method: POST
headers:
  - key: If-Match
    value: string
    disabled: false
    description: (Required) Quoted ETag from GET of the source revision, task, job, connector or working resource being changed.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: dcc2ca62-23da-2927-5a3e-5cc12cb16b75
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "decision": "<string>",
      "notes": "string",
      "checklist": {
        "sourcesChecked": false,
        "claimsChecked": true,
        "unitsChecked": true,
        "evidenceChecked": false,
        "mediaRightsChecked": true
      }
    }
